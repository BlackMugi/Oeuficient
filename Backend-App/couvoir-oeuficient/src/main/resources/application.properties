spring.application.name=Oeuficient

spring.profiles.default=local

# Base de données PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oeuficient}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=7200000

# Initialisation du premier administrateur
bootstrap.admin.enabled=true
bootstrap.admin.nom=${BOOTSTRAP_ADMIN_NOM}
bootstrap.admin.prenom=${BOOTSTRAP_ADMIN_PRENOM}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD}